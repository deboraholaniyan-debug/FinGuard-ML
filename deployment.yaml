
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finguard-api
spec:
  selector:
    matchLabels:
      app: finguard-api
  template:
    metadata:
      labels:
        app: finguard-api
    spec:
      containers:
        - name: finguard-api
          image: finguard-ml:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
